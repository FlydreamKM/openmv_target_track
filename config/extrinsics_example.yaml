%YAML:1.0
# Camera Extrinsics: World -> Camera
# Example: camera mounted 0.5m above ground, tilted down 30deg
---
rotation_matrix: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 1., 0., 0.,
           0., 0.8660254, -0.5,
           0., 0.5, 0.8660254 ]
translation_vector: !!opencv-matrix
   rows: 3
   cols: 1
   dt: d
   data: [ 0., 0.5, 0. ]

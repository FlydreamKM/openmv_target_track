%YAML:1.0
# OpenMV Target Track - Camera Calibration
# 90deg HFOV, 640x480, no distortion
# Generated by fromFOV(640, 480, 90.0)
---
image_width: 640
image_height: 480
camera_matrix: !!opencv-matrix
   rows: 3
   cols: 3
   dt: d
   data: [ 320., 0., 320., 0., 320., 240., 0., 0., 1. ]
distortion_coefficients: !!opencv-matrix
   rows: 1
   cols: 5
   dt: d
   data: [ 0., 0., 0., 0., 0. ]
hfov_deg: 90.0
vfov_deg: 73.739795291688039
